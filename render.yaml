services:
  - type: web
    name: sonar-backend-1
    runtime: node
    buildCommand: npm install && python3 -m pip install -r requirements.txt
    startCommand: npm start
    envVars:
      - key: CLIENT_URLS
        value: http://localhost:5173,https://sonar-1-iop9.onrender.com
      - key: PIPER_PYTHON
        value: python3
